<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FlowMelon">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="https://www.flowmelon.com/assets/img/projects/twirl.webp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#03011d">
  <link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
  <link rel="preload" href="{{root}}assets/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{root}}assets/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{root}}assets/css/base.css">
  <link rel="stylesheet" href="{{root}}assets/css/sections.css">
{{pageCss}}
  <script>
    /* Runs before paint: enables JS styles, honours reduced motion, skips the long preloader after the first visit. */
    (function (d) {
      var h = d.documentElement, rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      h.classList.remove('no-js'); h.classList.add('js-ready');
      if (rm) h.classList.add('no-motion');
      try { if (sessionStorage.getItem('fm-visited')) h.classList.add('is-returning'); sessionStorage.setItem('fm-visited', '1'); } catch (e) {}
      setTimeout(function () { if (!h.classList.contains('app-ready')) { h.classList.remove('js-ready'); h.classList.add('app-failed'); } }, 8000);
    })(document);
  </script>
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"ProfessionalService","name":"FlowMelon","url":"https://www.flowmelon.com","email":"hello@flowmelon.com","description":"Webflow development agency for startups, agencies and enterprises.","areaServed":"US"}</script>
</head>
<body class="{{bodyClass}}" data-page="{{page}}" data-sub="{{sub}}">
  <a class="skip-link" href="#main">Skip to content</a>
  <!-- @include icons -->

  <div class="preloader" aria-hidden="true">
    <div class="preloader_inner">
      <div class="preloader_logo"><!-- @include logo-mark --></div>
      <div class="preloader_bar"><span></span></div>
      <div class="preloader_count"><span data-preloader-count>000</span></div>
    </div>
    <div class="preloader_word">Webflow Development Agency</div>
  </div>
  <div class="transition" aria-hidden="true"><div class="transition_col"></div><div class="transition_col"></div><div class="transition_col"></div><div class="transition_col"></div><div class="transition_col"></div></div>
  <div class="cursor is-hidden" aria-hidden="true"><div class="cursor_ring"><span class="cursor_label"></span></div><div class="cursor_dot"></div></div>

  <!-- @include navbar -->
  <!-- @include menu -->

  <div class="page-wrapper">
    <main class="main-wrapper" id="main">
{{content}}
    </main>
    <!-- @include footer -->
  </div>

  <script src="{{root}}assets/vendor/gsap.min.js" defer></script>
  <script src="{{root}}assets/vendor/ScrollTrigger.min.js" defer></script>
  <script src="{{root}}assets/vendor/SplitText.min.js" defer></script>
  <script src="{{root}}assets/vendor/Draggable.min.js" defer></script>
  <script src="{{root}}assets/vendor/InertiaPlugin.min.js" defer></script>
  <script src="{{root}}assets/vendor/MotionPathPlugin.min.js" defer></script>
  <script src="{{root}}assets/vendor/CustomEase.min.js" defer></script>
  <script src="{{root}}assets/vendor/lenis.min.js" defer></script>
  <script src="{{root}}assets/js/app.js" data-root="{{root}}" defer></script>
</body>
</html>
