      <img class="logo-item" src="{{root}}assets/img/logos/beyrmedia.webp" alt="Beyrmedia" loading="lazy">
      <img class="logo-item" src="{{root}}assets/img/logos/dermalyft.webp" alt="DermaLyft" loading="lazy">
      <img class="logo-item" src="{{root}}assets/img/logos/twirl.svg" alt="Twirl" loading="lazy">
      <img class="logo-item" src="{{root}}assets/img/logos/appcues.svg" alt="Appcues" loading="lazy">
      <img class="logo-item" src="{{root}}assets/img/logos/agentbounty.svg" alt="AgentBounty" loading="lazy">
      <img class="logo-item" src="{{root}}assets/img/logos/tutortoday.webp" alt="TutorToday" loading="lazy">

</div>
