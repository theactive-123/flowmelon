<a href="{{root}}work/thermolab.html" class="work-card {{size}}" data-cats="{{cats}}" data-cursor="View">
  <div class="work-card_media" data-tilt="4"><img src="{{root}}assets/img/projects/{{img}}.webp" alt="{{title}} project" loading="lazy" data-parallax-img></div>
  <div class="work-card_info">
    <div><h3 class="work-card_title">{{title}}</h3><p class="work-card_desc">{{desc}}</p></div>
    <div class="work-card_meta"><span class="chip is-dark">{{tags}}</span><span class="work-card_year">{{year}}</span></div>
  </div>
</a>
