<article class="blog-card" data-cats="{{cats}}">
  <a href="{{href}}" class="blog-card_link" data-cursor="{{cursor|Read}}">
    <div class="blog-card_media" data-tilt="4"><img src="{{root}}assets/img/projects/{{img}}-sm.webp" alt="{{alt}}" loading="lazy" width="900" height="600"><span class="eyebrow is-blue blog-card_cat">{{cat}}</span>{{badge}}</div>
    <h3 class="blog-card_title">{{title}}</h3>
    <div class="blog-card_meta">{{date}} <span>·</span> {{read}} min read</div>
  </a>
</article>
